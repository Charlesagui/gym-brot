<!doctype html>
<html lang="es" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#08080c" />
		<meta name="description" content="Tu rutina de gym, simple y offline." />
		<title>Gym Brot - Mi Rutina</title>
		<!-- iOS todavía se guía por estos meta para abrir en modo app y pintar la barra
		     de estado; sin ellos la PWA instalada arranca con la barra de Safari. -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Gym-brot" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
