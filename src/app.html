<!doctype html>
<html lang="es" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#08080c" />
		<meta name="description" content="Tu rutina de gym, simple y offline." />
		<title>Gym Brot - Mi Rutina</title>
		<!-- iOS todavía se guía por estos meta para abrir en modo app y pintar la barra
		     de estado; sin ellos la PWA instalada arranca con la barra de Safari. -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Gym-brot" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<div style="padding: 2rem 1.25rem; text-align: center; font-family: system-ui, sans-serif">
				<h1 style="font-size: 1.25rem; margin: 0 0 0.5rem">Gym-brot necesita JavaScript</h1>
				<p style="margin: 0; color: #9aa0b4; line-height: 1.6">
					La app corre entera en tu teléfono y guarda los entrenamientos ahí mismo. Activá
					JavaScript para usarla; tus datos siguen guardados.
				</p>
			</div>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
